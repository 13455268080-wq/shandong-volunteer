<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta http-equiv="Cross-Origin-Embedder-Policy" content="unsafe-none" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>山东高考志愿填报助手 - 2026</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div>
        <h1>山东高考志愿填报助手</h1>
        <p>基于 2023-2025 年山东省录取数据，为 2026 考生提供 96 志愿冲稳保推荐。</p>
      </div>
      <div class="hint">
        <strong>使用说明：</strong>
        输入你的高考位次（必填）和分数（选填），选择选科科目，系统将自动匹配推荐 96 个志愿并计算录取概率。<br/>
        <strong>提示：</strong>位次是录取概率计算的主要依据，请准确填写。可直接修改条件再次查询，无需刷新页面。
      </div>
    </header>

    <main>
      <section class="panel" id="queryPanel">
        <h2>输入你的信息</h2>
        <div class="form-grid">
          <label>
            位次 <small style="color:var(--chong)">*必填</small>
            <input id="rankInput" type="number" placeholder="如：50000" min="1" />
          </label>
          <label>
            分数 <small>选填</small>
            <input id="scoreInput" type="number" placeholder="如：580" min="0" max="750" />
          </label>
          <label>
            批次 <small>选填</small>
            <select id="batchSelect">
              <option value="">全部批次</option>
              <option value="普通类一段">普通类一段</option>
              <option value="一段">一段</option>
              <option value="提前批">提前批</option>
              <option value="高职">高职</option>
            </select>
          </label>
          <label>
            院校 / 专业关键词 <small>选填</small>
            <input id="keywordInput" type="text" placeholder="如：山东大学、计算机" />
          </label>
          <label>
            专业方向偏好 <small>选填</small>
            <select id="majorPreference">
              <option value="">不限制</option>
              <option value="science">理工农医类</option>
              <option value="arts">经管文法类</option>
              <option value="military">提前批军校</option>
            </select>
          </label>
          <label style="grid-column: span 2;">
            选科科目 <small style="color:var(--chong)">*必填（至少选1科，山东3+3模式）</small>
            <div class="subjects-grid" id="subjectsContainer"></div>
          </label>
        </div>
        <div class="actions">
          <button id="queryButton" class="btn-primary" disabled>
            查询录取建议
          </button>
          <button id="newQueryButton" class="btn-secondary">清空重填</button>
          <span id="dataStatus" class="status">正在加载数据...</span>
        </div>
        <div class="loading-bar"><div class="loading-bar-inner"></div></div>
      </section>

      <div id="resultArea"></div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
